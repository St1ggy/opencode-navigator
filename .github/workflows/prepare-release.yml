name: Prepare Release

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      sha:
        description: Exact main commit after the verified screenshot merge
        value: ${{ jobs.screenshots.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: navigator-release-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: Refresh screenshots
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Capture synthetic Desktop GUI states on a virtual display
        run: bun run screenshots:gui
      - name: Verify Desktop GUI screenshot reproducibility
        run: bun run screenshots:gui:verify
      - name: Capture deterministic screenshots
        run: bun run screenshots
      - name: Verify screenshot reproducibility
        run: bun run screenshots:verify
      - name: Preserve screenshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diagnostics
          path: screenshots/
          retention-days: 7
      # No App token exists while capture/build code executes. Mint it only now.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-checks: read
      - name: Create, verify and merge the exact screenshot PR
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RELEASE_SHA: ${{ inputs.source-sha }}
        run: bun scripts/release.ts screenshots
