name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify release version
        run: node --eval 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} does not match v${version}`)'
      - name: Check npm version
        id: npm
        run: |
          package=$(node --print 'require("./package.json").name')
          version=$(node --print 'require("./package.json").version')
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public --ignore-scripts
