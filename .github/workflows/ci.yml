name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  opencode-smoke-v1:
    name: OpenCode 1.x (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.19.5']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: bun install -g opencode-ai@${{ matrix.version }}
      - run: |
          export OPENCODE_SMOKE_BIN="$(command -v opencode)"
          "$OPENCODE_SMOKE_BIN" --version
          bun run test:e2e:v1

  opencode-smoke-v2:
    name: OpenCode 2.x (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2.2.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm install -g @opencode/cli@${{ matrix.version }}
      - run: |
          export OPENCODE_V2_SMOKE_BIN="$(command -v opencode2)"
          "$OPENCODE_V2_SMOKE_BIN" --version
          bun run test:e2e:v2

  corner-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run scripts/generate-corner-font.py --check
