name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Owner reviews also attach the full CI suite to bot-created screenshot PRs.
  # Do not skip required jobs by review state: skipped jobs can count as success.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Measure TUI and GUI unit coverage
        run: bun run test:coverage
      - name: Retain source coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  coverage-upload:
    name: Publish main unit coverage
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'St1ggy/opencode-navigator'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: coverage/
      - name: Require both coverage reports
        run: |
          test -s coverage/tui/lcov.info
          test -s coverage/gui/lcov.info
      - name: Upload verified main coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/tui/lcov.info,coverage/gui/lcov.info
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          name: unit-render

  opencode-smoke-v1:
    name: OpenCode 1.x (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.19.5']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: bun install -g opencode-ai@${{ matrix.version }}
      - run: |
          export OPENCODE_SMOKE_BIN="$(command -v opencode)"
          "$OPENCODE_SMOKE_BIN" --version
          bun run test:e2e:v1

  headless-contracts:
    name: Headless boundaries and lifecycle contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --preload @opentui/solid/preload test/headless-boundaries.test.ts test/host-port-contracts.test.ts test/lease-pool.test.ts test/monitoring-runtime.test.ts

  opencode-smoke-v2:
    name: OpenCode 2.x (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2.2.6']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm install -g @opencode/cli@${{ matrix.version }}
      - run: |
          export OPENCODE_V2_SMOKE_BIN="$(command -v opencode2)"
          "$OPENCODE_V2_SMOKE_BIN" --version
          bun run test:e2e:v2

  corner-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run scripts/generate-corner-font.py --check

  desktop-smoke:
    name: Packaged Desktop (${{ matrix.mode }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, quota]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify packed plugin in isolated Desktop
        env:
          NAVIGATOR_GUI_QUOTA_FIXTURE: ${{ matrix.mode == 'quota' && '1' || '0' }}
        run: bun run test:e2e:gui
