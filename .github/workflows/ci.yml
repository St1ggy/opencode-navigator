name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Owner reviews also attach the full CI suite to bot-created screenshot PRs.
  # Do not skip required jobs by review state: skipped jobs can count as success.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  opencode-smoke-v1:
    name: OpenCode 1.x (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.19.5']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: bun install -g opencode-ai@${{ matrix.version }}
      - run: |
          export OPENCODE_SMOKE_BIN="$(command -v opencode)"
          "$OPENCODE_SMOKE_BIN" --version
          bun run test:e2e:v1

  headless-contracts:
    name: Headless boundaries and lifecycle contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --preload @opentui/solid/preload test/headless-boundaries.test.ts test/host-port-contracts.test.ts test/lease-pool.test.ts test/monitoring-runtime.test.ts

  opencode-smoke-v2:
    name: OpenCode 2.x (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2.2.6']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm install -g @opencode/cli@${{ matrix.version }}
      - run: |
          export OPENCODE_V2_SMOKE_BIN="$(command -v opencode2)"
          "$OPENCODE_V2_SMOKE_BIN" --version
          bun run test:e2e:v2

  corner-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run scripts/generate-corner-font.py --check

  desktop-smoke:
    name: Packaged Desktop (${{ matrix.mode }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, quota]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify packed plugin in isolated Desktop
        env:
          NAVIGATOR_GUI_QUOTA_FIXTURE: ${{ matrix.mode == 'quota' && '1' || '0' }}
        run: bun run test:e2e:gui
