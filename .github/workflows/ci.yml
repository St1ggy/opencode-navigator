name: CI
run-name: ${{ inputs.release_request || format('CI · {0}', github.event_name) }}

on:
  push:
    branches: [main]
  pull_request:
  # Owner reviews also attach the full CI suite to bot-created screenshot PRs.
  # Do not skip required jobs by review state: skipped jobs can count as success.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      release_request:
        description: Internal release correlation identifier
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Measure TUI and GUI unit coverage
        run: bun run test:coverage
      - name: Retain source coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  opencode-smoke-v1:
    # Stable ruleset context. This job now requires both host endpoints.
    name: OpenCode 1.x (1.19.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: |
          bun run build
          latest=$(node scripts/published-host.mjs v1)
          NAVIGATOR_HOST_ENDPOINT=minimum bash scripts/smoke-opencode.sh
          if [[ "$(node scripts/host-versions.mjs v1 minimum)" != "$latest" ]]; then
            NAVIGATOR_HOST_ENDPOINT=latest NAVIGATOR_HOST_VERSION="$latest" bash scripts/smoke-opencode.sh
          fi

  headless-contracts:
    name: Headless boundaries and lifecycle contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun test --preload @opentui/solid/preload test/headless-boundaries.test.ts test/host-port-contracts.test.ts test/lease-pool.test.ts test/monitoring-runtime.test.ts

  opencode-smoke-v2:
    # Stable ruleset context. This job now requires both host endpoints.
    name: OpenCode 2.x (2.2.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: |
          bun run build
          latest=$(node scripts/published-host.mjs v2)
          NAVIGATOR_HOST_ENDPOINT=minimum bash scripts/smoke-opencode-v2.sh
          if [[ "$(node scripts/host-versions.mjs v2 minimum)" != "$latest" ]]; then
            NAVIGATOR_HOST_ENDPOINT=latest NAVIGATOR_HOST_VERSION="$latest" bash scripts/smoke-opencode-v2.sh
          fi

  corner-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run scripts/generate-corner-font.py --check

  desktop-smoke:
    name: Packaged Desktop (${{ matrix.mode }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, quota]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Verify packed plugin in isolated Desktop
        env:
          NAVIGATOR_GUI_QUOTA_FIXTURE: ${{ matrix.mode == 'quota' && '1' || '0' }}
        run: |
          bun run build
          latest=$(node scripts/published-host.mjs v2)
          NAVIGATOR_HOST_ENDPOINT=minimum node scripts/smoke-opencode-gui.mjs
          if [[ "$(node scripts/host-versions.mjs v2 minimum)" != "$latest" ]]; then
            NAVIGATOR_HOST_ENDPOINT=latest NAVIGATOR_HOST_VERSION="$latest" NAVIGATOR_GUI_DRIVER=accessibility node scripts/smoke-opencode-gui.mjs
          fi
