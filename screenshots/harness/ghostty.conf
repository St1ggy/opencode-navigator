font-family = JetBrainsMono Nerd Font Mono
font-family = OpenCode Navigator Corners
font-codepoint-map = U+10F000-U+10F007=OpenCode Navigator Corners
font-size = 13
font-feature = -calt,-liga,-dlig
freetype-load-flags = hinting,no-force-autohint,autohint,light
background = 111318
foreground = e6e6e6
background-opacity = 1
cursor-style-blink = false
cursor-opacity = 0
window-decoration = none
window-padding-x = 0
window-padding-y = 0
window-width = 140
window-height = 48
window-show-tab-bar = never
resize-overlay = never
shell-integration = none
gtk-single-instance = false
confirm-close-surface = false
title = NavigatorScreenshotHarness
class = org.opencode.navigator.screenshot
